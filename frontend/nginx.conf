server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Lo mismo que admite el backend por peticion (spring.servlet.multipart.max-request-size):
    # un fichero de hasta 10 MB mas el resto del formulario. Sin esto Nginx corta a 1 MB y
    # cualquier documento o foto mas grande falla con un 413 antes de llegar al backend.
    client_max_body_size 12m;

    # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html cambia en cada despliegue (referencia los assets con hash nuevo)
    # pero sin esta cabecera el navegador puede guardarlo igualmente: cada cambio
    # de interfaz corre el riesgo de no verse hasta un refresco forzado. Con
    # "no-cache" el navegador SIEMPRE revalida contra el servidor antes de usar
    # la copia guardada (no es "no guardar nada", es "no usarlo sin preguntar").
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Las llamadas a la IA van aparte: generar el plan completo de todos los
    # sprints en una sola respuesta puede tardar unos minutos con un documento
    # largo. Con los 60 s del resto de la API, Nginx cortaria la respuesta con un
    # 504 mientras el backend sigue trabajando. Al ser una expresion regular gana a
    # la location /api/ de abajo; proxy_pass va sin ruta porque en una regex no se
    # permite, y asi reenvia la URI tal cual.
    location ~ ^/api/(projects/[0-9]+/ai-plan|workspaces/[0-9]+/ai/) {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
    }

    # La API se reenvia al contenedor del backend (mismo origen -> sin CORS).
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger UI accesible tambien a traves del frontend.
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
    }

    # SPA: cualquier ruta desconocida la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
