# Pila completa del TFG: base de datos Oracle + backend Spring Boot + frontend React.
# Arranque:  docker compose up --build
# Requisitos: fichero .env en la raiz (copiar de .env.example).

services:

  # ---------------------------------------------------------------- Oracle XE
  oracle-db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: planifia-oracle
    environment:
      # Contrasena de SYS/SYSTEM
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      # Usuario de aplicacion que crea la imagen automaticamente en FREEPDB1
      APP_USER: ${DB_USERNAME}
      APP_USER_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      # Script incluido en la imagen gvenzl: comprueba que la BD acepta conexiones.
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      # La primera arrancada crea la base de datos y tarda varios minutos.
      start_period: 180s
    restart: unless-stopped

  # ---------------------------------------------- Correo (solo en desarrollo)
  # Servidor SMTP de desarrollo: recoge todo lo que envia la aplicacion y lo
  # ensena en http://localhost:8025 sin mandar nada de verdad a nadie.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: planifia-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------- Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: planifia-backend
    depends_on:
      oracle-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Sin esto el contenedor va en UTC y, de madrugada, "hoy" para el servidor
      # es todavia el dia anterior: los sprints y las fechas que calcula la IA
      # saldrian corridos un dia respecto al calendario de quien lo usa.
      TZ: ${TZ:-Europe/Madrid}
      DB_URL: jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SERVER_PORT: 8080
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10MB}
      # Modulo de IA: modelo alojado en DeepSeek, no local. Hace falta DEEPSEEK_API_KEY en .env.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_TIMEOUT: ${AI_TIMEOUT:-5m}
      # Correo de las invitaciones. En desarrollo va a Mailpit, que no lo reenvia
      # a ninguna parte; para mandarlo de verdad, apunta MAIL_HOST a un SMTP real.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@planifia.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # Cuenta de administrador de la plataforma que se crea al primer arranque
      # si todavia no existe ninguna (vease AdminBootstrapRunner). Cambia el
      # valor por defecto antes de desplegar de verdad.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@planifia.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      # Los ficheros adjuntos de las tareas viven fuera del contenedor.
      - uploads-data:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # ------------------------------------------------------ Frontend React/Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: planifia-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      # 127.0.0.1 y no "localhost": dentro del contenedor localhost resuelve
      # primero a ::1 y Nginx solo escucha en IPv4.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  oracle-data:
    driver: local
  uploads-data:
    driver: local
