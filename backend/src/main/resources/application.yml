# Configuracion comun a todos los perfiles.
# Las credenciales NUNCA se escriben aqui: llegan por variables de entorno.
spring:
  application:
    name: planifia-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: KanbanHikariPool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      # En el TFG se usa la generacion automatica de esquema.
      # Migrar a Flyway antes de la entrega final.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    context-path: /

app:
  security:
    jwt:
      # Obligatorio: minimo 32 caracteres (HS256). Sin valor por defecto a proposito.
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
      issuer: ${JWT_ISSUER:tfg-kanban}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # Cuenta que se crea al arrancar si todavia no existe ningun ADMIN (vease
    # AdminBootstrapRunner). Cambia estos valores antes de desplegar de verdad.
    email: ${ADMIN_EMAIL:admin@planifia.local}
    password: ${ADMIN_PASSWORD:admin123}
  ai:
    # Planificacion automatica con un modelo que corre en local (Ollama).
    # Nada sale de la maquina: no hay servicios externos ni claves de API.
    enabled: ${AI_ENABLED:true}
    base-url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3}
    timeout: ${AI_TIMEOUT:3m}
    max-tasks: ${AI_MAX_TASKS:8}
  storage:
    # Directorio de los ficheros adjuntos (volumen de Docker en despliegue).
    upload-dir: ${UPLOAD_DIR:./uploads}
    # Tamano maximo por fichero en bytes (10 MB).
    max-file-size: ${MAX_FILE_SIZE_BYTES:10485760}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.tfg.kanban: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
