# Configuracion comun a todos los perfiles.
# Las credenciales NUNCA se escriben aqui: llegan por variables de entorno.
spring:
  application:
    name: planifia-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mail:
    # Sin MAIL_HOST no se crea el JavaMailSender y los correos solo se escriben en
    # el log (vease MailService): la aplicacion arranca igual sin servidor SMTP.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: KanbanHikariPool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      # En el TFG se usa la generacion automatica de esquema.
      # Migrar a Flyway antes de la entrega final.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    context-path: /

app:
  security:
    jwt:
      # Obligatorio: minimo 32 caracteres (HS256). Sin valor por defecto a proposito.
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
      issuer: ${JWT_ISSUER:tfg-kanban}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # Cuenta que se crea al arrancar si todavia no existe ningun ADMIN (vease
    # AdminBootstrapRunner). Cambia estos valores antes de desplegar de verdad.
    email: ${ADMIN_EMAIL:admin@planifia.local}
    password: ${ADMIN_PASSWORD:admin123}
  mail:
    # Los avisos de invitacion a un equipo. Con enabled=false no sale ninguno.
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@planifia.local}
    # Donde vive la interfaz: con esto se compone el enlace de la invitacion.
    base-url: ${APP_BASE_URL:http://localhost:3000}
  ai:
    # Planificacion automatica con un modelo alojado en Groq: el documento y los
    # datos del equipo salen de esta maquina hacia sus servidores para generar el plan.
    enabled: ${AI_ENABLED:true}
    base-url: ${GROQ_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    timeout: ${AI_TIMEOUT:2m}
    max-tasks: ${AI_MAX_TASKS:60}
    temperature: ${AI_TEMPERATURE:0.2}
    max-retries: ${AI_MAX_RETRIES:2}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:6000}
  storage:
    # Directorio de los ficheros adjuntos (volumen de Docker en despliegue).
    upload-dir: ${UPLOAD_DIR:./uploads}
    # Tamano maximo por fichero en bytes (10 MB).
    max-file-size: ${MAX_FILE_SIZE_BYTES:10485760}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.tfg.kanban: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
